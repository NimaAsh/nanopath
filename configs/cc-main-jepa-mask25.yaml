# Alliance: JEPA variant — heavier block mask coverage (0.25).
# iBOT patch objective for an I-JEPA predictor that regresses the EMA teacher's patch features at masked
# target blocks (latent smooth-L1), running alongside DINO + KDE. The one change vs the champion is the
# patch objective (iBOT -> JEPA). Keep save_every null (the JEPA path builds no iBOT heads to checkpoint).

project:
  name: jepa-mask25
  family: nanopath
  recipe_id: dinov2-vits14-reg-jepa
  output_dir: /scratch/$USER/nanopath/main-leopard/jepa-mask25
  wandb_dir: /scratch/$USER/nanopath/wandb

data:
  dataset_dir: /scratch/$USER/nanopath/data/tcga_parquet
  split_seed: 42
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  color_jitter: 0.3
  color_jitter_saturation: 0.25
  hed_jitter: 0.06
  blur_prob: 0.35
  tissue_thresh: 0.0 # >0 enables tissue rejection sampling: min fraction of saturated (non-background) pixels
  stain_norm: false # true applies Macenko-style stain normalization (needs stain_ref)
  curation: none # sampler bias: none | slide (1/slide-tile-count) | cluster (curate.py morphology weights)

model:
  type: dinov2_vits14_reg

train:
  seed: 1337
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000
  max_train_flops: 1000000000000000000
  log_every: 100
  save_every: null
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 112
  resume: null

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  adam_beta2: 0.999 # AdamW second-moment decay; 0.999 is the DINOv2 default
  warmup_flop_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0
  ibot_loss_weight: 1.0
  mask_prob: 0.5
  meta_weight: 0.0 # FINO metadata guidance weight on the CLS token (0.03 = FINO); 0 = off
  meta_spurious: true # true = suppress the TCGA site via gradient reversal; false = encode it (align)
  jepa_weight: 1.0 # >0 swaps iBOT for the predictor-based patch objective at this loss weight
  jepa_keep_ibot: false # with jepa_weight>0, also run iBOT cluster-CE on the masked patches (DINO+iBOT+JEPA)
  jepa_cluster: false # false -> plain JEPA (smooth-L1 regression); true -> CAPI (predict Sinkhorn clusters)
  jepa_pred_depth: 4 # I-JEPA predictor depth (transformer Blocks); only read when jepa_weight>0
  jepa_pred_width: 0 # I-JEPA predictor width; 0 = full backbone dim, smaller (e.g. 192) regularizes
  jepa_block_scale: 0.25 # I-JEPA target block size (fraction of the grid per block); mask coverage
  jepa_stage2_frac: 0.0 # >0 => JEPA-only stage 1 until this sample fraction, then concurrent DINO+JEPA

probe:
  enabled: true
  model_weights: ema
  count: 1
  datasets:
    - bracs
    - break_his
    - mhist
    - pcam
  segmentation_datasets:
    - pannuke
    - monusac
    - consep
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bracs: /scratch/$USER/nanopath/probes/bracs
    break_his: /scratch/$USER/nanopath/probes/break_his
    leopard_bcr: /scratch/$USER/nanopath/probes/leopard_bcr
    consep: /scratch/$USER/nanopath/probes/consep
    cptac_pda_os: /scratch/$USER/nanopath/probes/cptac_pda_os
    mhist: /scratch/$USER/nanopath/probes/mhist
    monusac: /scratch/$USER/nanopath/probes/monusac
    pcam: /scratch/$USER/nanopath/probes/pcam
    pannuke: /scratch/$USER/nanopath/probes/pannuke
    pathorob: /scratch/$USER/nanopath/probes/pathorob
    surgen: /scratch/$USER/nanopath/probes/surgen
    ucla_lung: /scratch/$USER/nanopath/probes/ucla_lung
