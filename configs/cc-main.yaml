project:
  name: main-dinov2
  family: nanopath
  recipe_id: dinov2-vits14-reg-kde
  output_dir: /scratch/$USER/nanopath/main/default
  wandb_dir: /scratch/$USER/nanopath/wandb

data:
  # dataset_dir holds parquet shards prepared on the Alliance login node.
  dataset_dir: /scratch/$USER/nanopath/data/tcga_parquet
  split_seed: 42
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.2, 1.0]
  local_crop_scale: [0.03, 0.25]
  color_jitter: 0.45
  color_jitter_saturation: 0.4
  hed_jitter: 0.12

model:
  type: dinov2_vits14_reg

train:
  seed: 1337
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # tile presentations; global/local crops still count as one sample
  max_train_flops: 1000000000000000000 # 1.0e18, the leaderboard FLOP budget
  log_every: 20
  save_every: 1000
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 98
  resume: null

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  warmup_flop_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0

probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bracs
    - break_his
    - mhist
    - pcam
  segmentation_datasets:
    - pannuke
    - monusac
    - consep
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bracs: /scratch/$USER/nanopath/probes/bracs
    break_his: /scratch/$USER/nanopath/probes/break_his
    leopard_bcr: /scratch/$USER/nanopath/probes/leopard_bcr
    consep: /scratch/$USER/nanopath/probes/consep
    cptac_pda_os: /scratch/$USER/nanopath/probes/cptac_pda_os
    mhist: /scratch/$USER/nanopath/probes/mhist
    monusac: /scratch/$USER/nanopath/probes/monusac
    pcam: /scratch/$USER/nanopath/probes/pcam
    pannuke: /scratch/$USER/nanopath/probes/pannuke
    pathorob: /scratch/$USER/nanopath/probes/pathorob
    surgen: /scratch/$USER/nanopath/probes/surgen
    ucla_lung: /scratch/$USER/nanopath/probes/ucla_lung
